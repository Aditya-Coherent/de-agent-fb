ucers dominate but premium imports are gaining niche traction."}, {"region": "North America", "note": "High-value market where apple cider and balsamic premiumization, health positioning and clean-label reformulation are driving mix shift even as basic white vinegar volumes flatten."}, {"region": "Europe", "note": "Mature but quality-driven, with protected-origin balsamic and wine vinegars defending value; regulatory scrutiny on health claims and sustainability labeling will shape branding."}, {"region": "Central & South America", "note": "Smaller base but rising food-service and retail penetration, with local fruit vinegars and price-sensitive demand; currency and harvest volatility are key swing factors."}, {"region": "Middle East & Africa", "note": "Smallest base but notable upside from urbanization, packaged food growth and food-service investment, though affordability and import dependence temper near-term momentum."}], "outlook_summary": "The global vinegar market is set to keep expanding, but growth will be uneven and increasingly value-led rather than volume-led. Asia Pacific should continue to anchor overall demand, while North America and Europe drive premiumization and clean-label innovation. Commodity white vinegar faces margin pressure and share loss to specialty and functional segments, with food service and industrial applications becoming the decisive battleground."}, "steps": [{"step_id": "market_name", "kind": "input", "title": "Market Name", "description": "The only user input this demo takes -- everything else is derived from it.", "data": {"market_name": "Vinegar", "base_year": 2025}}, {"step_id": "llm_affinity", "kind": "llm_call", "title": "Fetch Product x Application Affinity Prior", "description": "One market-wide LLM & Web call: how strongly each product is associated with each application (0-1 relative propensity, not percentages). This is only the SEED for the IPF balancing -- it shapes how each country's total spreads across joint cells, if(affinity) STEPS.push({t:'Product ↔ Application affinity', d:'AI judges structure, not size', badge:'b-ai', render:()=>{
  const a = affinity.computed.affinity, prods=Object.keys(a), apps=Object.keys(a[prods[0]]);
  return `<p class="lead">${esc(affinity.description)}</p>
  <div class="sec"><h3>Affinity prior (0 = never used this way, 1 = primary use)</h3>
  ${tbl(['Product',...apps.map(x=>({t:x.replace(' Industry',''),r:1}))],
    prods.map(p=>`<tr><td>${p}</td>${apps.map(x=>`<td class="r">${a[p][x].toFixed(2)}</td>`).join('')}</tr>`).join(''))}
  <div class="note">This shapes <em>how</em> a country's total spreads across cells — it can never change any total.</div></div>
  <details><summary>▸ Exact prompt sent</summary><pre>${esc(affinity.request.system)}\n\n${esc(affinity.request.user)}</pre></details>
  <details><summary>▸ Raw response</summary><pre>${esc(JSON.stringify(affinity.response,null,2))}</pre></details>`;}});

seg.steps.filter(s=>s.step_id.startsWith('llm_region_')).forEach(st=>{
  const reg = seg.regions.find(r=>st.title.includes(r.name));
  STEPS.push({t:st.title.replace('Fetch ','').replace(': Direct Dollar Estimates per Country',''),
    d:'Direct $ estimates per country', badge:'b-ai', render:()=>`
    <p class="lead">${esc(st.description)}</p>
    <div class="sec"><h3>What came back, after deterministic reconciliation</h3>
    ${tbl(['Country',{t:'Revenue',r:1},{t:'Share of region',r:1}],
      reg.countries.map(c=>`<tr><td>${c.name}</td><td class="r">${money(c.total_usd_mn)}</td><td class="r">${(c.total_usd_mn/reg.total_usd_mn*100).toFixed(1)}%</td></tr>`).join('')
      + `<tr class="tot"><td>${reg.name}</td><td class="r">${money(reg.total_usd_mn)}</td><td class="r">100%</td></tr>`)}
    <div class="note">Each country's total = the <strong>sum</strong> of its Application-view dollar values. Never a percentage of a parent.</div></div>
    <details><summary>▸ Exact prompt sent</summary><pre>${esc(st.request.system)}\n\n${esc(st.request.user)}</pre></details>
    <details><summary>▸ Raw response</summary><pre>${esc(JSON.stringify(st.response,null,2))}</pre></details>`});
});

const agg = seg.steps.find(s=>s.step_id==='aggregate');
if(agg) STEPS.push({t:'Rollup & validation', d:'Pure arithmetic, no AI', badge:'b-calc', render:()=>`
  <p class="lead">${esc(agg.description)}</p>
  <div class="sec">${tbl(['Check',{t:'Expected',r:1},{t:'Actual',r:1},{t:'',r:1}],
    agg.checks.map(c=>`<tr><td>${c.check}</td><td class="r">${money(c.expected)}</td><td class="r">${money(c.actual)}</td><td class="r ok">${c.ok?'✓':'✗'}</td></tr>`).join(''))}</div>`});

STEPS.push({t:'The formula', d:'Four deterministic rules', badge:'b-calc', render:()=>{
  const app = india.views.application, cats = Object.keys(app);
  const sum = cats.reduce((a,k)=>a+app[k],0);
  return `<p class="lead">Every dollar in this model comes from exactly four rules applied to leaf-level estimates.</p>
  <div class="sec"><h3>The rules</h3>
  <div class="formula">1 &nbsp; Country total = Σ (Application category values)</div>
  <div class="formula">2 &nbsp; Other views rescaled = (raw value ÷ raw view sum) × Country total</div>
  <div class="formula">3 &nbsp; Region total = Σ (Country totals)</div>
  <div class="formula">4 &nbsp; Global total = Σ (Region totals)</div></div>
  <div class="sec"><h3>Worked with real numbers — ${india.name}</h3>
  <div class="formula">${cats.map(c=>`${c} (${money(app[c])})`).join(' + ')}<br>= <strong>${money(sum)}</strong></div>
  <div class="formula">${seg.regions.map(r=>`${r.name} (${money(r.total_usd_mn)})`).join(' + ')}<br>= <strong>${money(seg.global_total_usd_mn)}</strong></div></div>`;}});

STEPS.push({t:'Product → Application', d:'Drill-down with $/litre', badge:'b-calc', render:()=>renderTree()});

STEPS.push({t:'Evidence check', d:'Verified vs official customs data', badge:'b-ver', render:()=>{
  if(!trade.available) return '<p class="lead">No customs evidence retrieved.</p>';
  const o = trade.origins||[];
  return `<p class="lead">The AI estimated prices. Here is what national customs authorities actually recorded — independently, for the same market.</p>
  <div class="sec"><h3>${trade.source} · HS ${trade.hs_code} · ${trade.year}</h3>
  <div class="grid2">
    <div class="card"><div class="l">Imports <span class="badge b-ver">Verified</span></div><div class="v">${pl(trade.imports.unit_value_usd_per_l)}</div><div class="s">$${trade.imports.value_usd.toLocaleString()} ÷ ${trade.imports.weight_kg.toLocaleString()} kg</div></div>
    <div class="card"><div class="l">Exports <span class="badge b-ver">Verified</span></div><div class="v">${pl(trade.exports.unit_value_usd_per_l)}</div><div class="s">$${trade.exports.value_usd.toLocaleString()} ÷ ${trade.exports.weight_kg.toLocaleString()} kg</div></div>
    <div class="card"><div class="l">AI blended estimate <span class="badge b-mod">Modelled</span></div><div class="v">${pl(india.product_application?.blended_price_usd_per_l)}</div><div class="s">whole market incl. domestic production</div></div>
  </div></div>
  <div class="sec"><h3>Verified transaction prices by country of origin</h3>
  ${tbl(['Origin',{t:'Value',r:1},{t:'Quantity',r:1},{t:'Verified price',r:1}],
    o.slice(0,8).map(x=>`<tr><td>${x.partner}</td><td class="r">$${x.value_usd.toLocaleString()}</td><td class="r">${x.weight_kg.toLocaleString()} kg</td><td class="r ok">${pl(x.unit_value_usd_per_l)}</td></tr>`).join(''))}</div>
  <div class="sec"><h3>What is verified, what is modelled</h3>
  ${tbl(['Label','Meaning','Example'],[
    ['<span class="badge b-ver">Verified</span>','Traced to a named official source with a live URL','Import price '+pl(trade.imports.unit_value_usd_per_l)+' — UN Comtrade'],
    ['<span class="badge b-calc">Derived</span>','Calculated from verified inputs by a published formula','Volume = Revenue ÷ Price per litre'],
    ['<span class="badge b-mod">Modelled</span>','No source exists anywhere; documented method','Share of vinegar used in cleaning vs food'],
  ].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join(''))}</div>
  <div class="note">${esc(trade.coverage_note)}</div>
  <div class="note"><a href="${trade.source_urls.imports}" target="_blank">↗ Open the raw import record</a> &nbsp;·&nbsp; <a href="${trade.source_urls.by_partner}" target="_blank">↗ Open the by-origin record</a></div>`;}});

STEPS.push({t:'Statistical model', d:'Independent cross-check', badge:'b-calc', render:()=>{
  const w = model.rows.filter(r=>Math.abs(r.err)<=6).length;
  return `<p class="lead">A log-linear regression built only from real-world features — population, GDP per capita and region — fitted independently and compared against the AI's country totals.</p>
  <div class="sec"><div class="formula">log(Value) = β₀ + β₁·log(Population) + β₂·log(GDP per capita) + Σ γ·Region</div>
  <div class="grid2">
    <div class="card"><div class="l">R²</div><div class="v">${model.r2.toFixed(3)}</div><div class="s">variance explained by 3 real features</div></div>
    <div class="card"><div class="l">Mean error</div><div class="v">${model.mape.toFixed(1)}%</div><div class="s">across all ${model.rows.length} countries</div></div>
    <div class="card"><div class="l">Within ±6%</div><div class="v">${w} / ${model.rows.length}</div><div class="s">independent model agrees with AI</div></div>
  </div></div>
  <div class="sec"><h3>Fitted coefficients</h3>
  ${tbl(['Term',{t:'OLS',r:1},{t:'Ridge',r:1}],
    [['Intercept',model.ols_int,model.ridge_int]].concat(model.terms.map((t,i)=>[t,model.ols[i],model.ridge[i]]))
    .map(r=>`<tr><td>${r[0]}</td><td class="r">${r[1]>=0?'+':''}${r[1].toFixed(3)}</td><td class="r">${r[2]>=0?'+':''}${r[2].toFixed(3)}</td></tr>`).join(''))}
  <div class="note">Population elasticity below 1 and income elasticity near 0.8 — bigger and richer countries buy more, but not proportionally. These are learned from the data, not assumed.</div></div>
  <div class="sec"><h3>Model vs AI, by country</h3>
  ${tbl(['Country',{t:'AI number',r:1},{t:'Model',r:1},{t:'Difference',r:1}],
    model.rows.map(r=>`<tr><td>${r.country}</td><td class="r">${money(r.actual)}</td><td class="r">${money(r.model)}</td><td class="r ${Math.abs(r.err)<=6?'ok':'warn'}">${r.err>=0?'+':''}${r.err.toFixed(1)}%</td></tr>`).join(''))}</div>`;}});

if(seg.narrative) STEPS.push({t:'Market intelligence', d:'Qualitative, no invented numbers', badge:'b-ai', render:()=>{
  const n = seg.narrative;
  const li = a => a.map(x=>`<li style="margin:4px 0">${esc(x)}</li>`).join('');
  return `<p class="lead">${esc(n.headline)}</p>
  <div class="grid2">
    <div class="sec"><h3>Key shifts</h3><ul style="padding-left:16px;font-size:12px;color:#c4c4c4">${li(n.key_shifts)}</ul></div>
    <div class="sec"><h3>Growth drivers</h3><ul style="padding-left:16px;font-size:12px;color:#c4c4c4">${li(n.growth_drivers)}</ul></div>
  </div>
  <div class="sec"><h3>Regions to watch</h3><div class="grid2">
    ${n.regions_to_watch.map(r=>`<div class="card"><div class="v" style="font-size:13px">${esc(r.region)}</div><div class="s">${esc(r.note)}</div></div>`).join('')}
  </div></div>
  <div class="note" style="font-style:italic">${esc(n.outlook_summary)}</div>
  <div class="note">No CAGR or forecast figure is produced — that would require a genuine second time-point estimate. Direction and drivers only.</div>`;}});

STEPS.push({t:'Final result', d:'The complete picture', badge:'b-calc', render:()=>{
  const gv = seg.global_views;
  return `<p class="lead">Six independent lenses on the same ${money(seg.global_total_usd_mn)} — each sums back to the identical total.</p>
  <div class="sec"><h3>Regions</h3>
  ${tbl(['Region',{t:'Revenue',r:1},{t:'Share',r:1},{t:'Countries',r:1}],
    seg.regions.map(r=>`<tr><td>${r.name}</td><td class="r">${money(r.total_usd_mn)}</td><td class="r">${(r.total_usd_mn/seg.global_total_usd_mn*100).toFixed(1)}%</td><td class="r">${r.countries.length}</td></tr>`).join('')
    + `<tr class="tot"><td>Global</td><td class="r">${money(seg.global_total_usd_mn)}</td><td class="r">100%</td><td class="r">${countries.length}</td></tr>`)}</div>
  ${Object.keys(gv).map(k=>{
    const cats=Object.entries(gv[k]).sort((a,b)=>b[1]-a[1]);
    const tot=cats.reduce((a,c)=>a+c[1],0);
    return `<div class="sec"><h3>${k.replace(/_/g,' ')} — sums to ${money(tot)}</h3>
    ${cats.map(([c,v])=>`<div style="margin:5px 0"><div style="display:flex;justify-content:space-between;font-size:11.5px"><span style="color:#a1a1aa">${c}</span><span>${money(v)}</span></div><div class="bar"><i style="width:${(v/tot*100).toFixed(1)}%"></i></div></div>`).join('')}</div>`;
  }).join('')}`;}});

// ---------------------------------------------------------------- tree
let treeDir = 'pa', openN = {};
function renderTree(){
  const pa = india.product_application;
  if(!pa) return '<p class="lead">No matrix available.</p>';
  const parents = treeDir==='pa' ? pa.products : pa.applications;
  const pk = treeDir==='pa' ? 'product' : 'application';
  const ck = treeDir==='pa' ? 'application' : 'product';
  const rowsH = parents.map(p=>{
    const kids = pa.cells.filter(c=>c[pk]===p).map(c=>({l:c[ck],r:c.value_usd_mn,v:c.volume_mn_l,p:c.price_usd_per_l})).sort((a,b)=>b.r-a.r);
    const rev = kids.reduce((a,k)=>a+k.r,0), vol = kids.reduce((a,k)=>a+(k.v||0),0);
    const open = !!openN[p];
    return `<div class="node lv1" onclick="tg('${p.replace(/'/g,"\\'")}')"><span class="lbl">${open?'▾':'▸'} ${p}</span>
      <span class="m">${money(rev)}</span><span class="m">${lit(vol)}</span><span class="m">${pl(vol>0?rev/vol:null)}</span></div>`
      + (open ? kids.map(k=>`<div class="node lv2"><span class="lbl">${k.l}</span><span class="m">${money(k.r)}</span><span class="m">${lit(k.v)}</span><span class="m">${pl(k.p)}</span></div>`).join('') : '');
  }).join('');
  return `<p class="lead">The drill-down that independent lenses alone cannot give: what each product is actually <em>used for</em>, with revenue, volume and unit price at every node.</p>
  <div class="sec"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <h3 style="margin:0">${india.name} · ${treeDir==='pa'?'Product → Application':'Application → Product'}</h3>
    <button class="flip" onclick="flip()">⇄ Flip direction</button></div>
  <div class="node" style="color:#6b6b6b;font-size:10px;text-transform:uppercase;letter-spacing:.06em;cursor:default">
    <span class="lbl">Node</span><span class="m">Revenue</span><span class="m">Volume</span><span class="m">Price</span></div>
  <div class="node lv1" style="cursor:default"><span class="lbl">${india.name} — total</span>
    <span class="m">${money(india.total_usd_mn)}</span><span class="m">${lit(pa.total_volume_mn_l)}</span><span class="m">${pl(pa.blended_price_usd_per_l)}</span></div>
  <div class="tree">${rowsH}</div>
  <div class="note">Balanced by IPF/RAS: every parent equals the exact sum of its children <em>in both directions</em>. Volume is derived (Revenue ÷ Price), never estimated directly.</div></div>`;
}
function tg(p){ openN[p]=!openN[p]; draw(); }
function flip(){ treeDir = treeDir==='pa'?'ap':'pa'; openN={}; draw(); }

// ---------------------------------------------------------------- render
let cur = 0;
function draw(){
  document.getElementById('rail').innerHTML = STEPS.map((s,i)=>
    `<div class="step ${i===cur?'on':''}" onclick="go(${i})"><span class="n">${i+1}</span>
     <span><span class="t">${s.t}</span><span class="d">${s.d}</span></span></div>`).join('');
  const s = STEPS[cur];
  document.getElementById('panel').innerHTML =
    `<h2>${s.t} <span class="badge ${s.badge}">${{'b-ai':'AI / Web','b-calc':'Calculated','b-ver':'Verified'}[s.badge]}</span></h2>` + s.render();
}
function go(i){ cur=i; draw(); window.scrollTo({top:0,behavior:'smooth'}); }
draw();
</script></body></html>
